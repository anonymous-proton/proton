[pytest]
testpaths = tests
addopts = -m "not docker and not gpu and not slow"
markers =
    unit: fast unit tests without docker or grpc servers
    integration: grpc and multi-component tests without docker
    e2e: end-to-end tests that exercise supervisor and containers
    docker: tests that require a local docker daemon
    gpu: tests that require a GPU runtime
    slow: longer-running tests
